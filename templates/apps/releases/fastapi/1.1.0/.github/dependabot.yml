{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly"
      },
      "open-pull-requests-limit": 1,
      "ignore": [
        {
          "dependency-name": "*",
          "update-types": [
            "version-update:semver-major"
          ]
        }
      ],
      "groups": {
        "compatible": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      }
    },
    {
      "package-ecosystem": "pip",
      "directory": "/",
      "schedule": {
        "interval": "weekly"
      },
      "open-pull-requests-limit": 1,
      "ignore": [
        {
          "dependency-name": "*",
          "update-types": [
            "version-update:semver-major"
          ]
        }
      ],
      "groups": {
        "compatible": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      }
    }
  ]
}
