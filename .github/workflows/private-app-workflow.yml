name: Private application workflow
on:
  pull_request:
    paths:
      - .github/workflows/private-app-workflow.yml
      - scripts/**
      - config/mobile/**
      - docs/036-mobile-python-backend/**
      - runbooks/manage-mobile-backends.md
      - docs/031-expo-project-creation/**
      - runbooks/manage-expo-projects.md
      - config/templates/**
      - schemas/templates/**
      - docs/023-repository-credential-broker/**
      - config/repository-credentials/**
      - runbooks/manage-repository-credentials.md
      - docs/022-github-repository-automation/**
      - runbooks/manage-project-repositories.md
      - docs/025-multi-service-projects/**
      - runbooks/manage-multi-service-projects.md
      - config/browser-checks/**
      - docs/024-python-fastapi-template/**
      - runbooks/manage-python-apis.md
      - docs/021-template-catalogue/**
      - runbooks/manage-project-templates.md
      - config/toolchains/**
      - schemas/toolchains/**
      - docs/020-pinned-language-toolchains/**
      - runbooks/manage-project-toolchains.md
      - config/project-dependencies/**
      - schemas/project-dependencies/**
      - schemas/project/**
      - requirements/**
      - templates/apps/**
      - docs/019-project-dependency-policy/**
      - runbooks/manage-project-dependencies.md
      - docs/018-first-private-application/**
      - runbooks/manage-private-apps.md
  push:
    branches: [main]
    paths:
      - .github/workflows/private-app-workflow.yml
      - scripts/**
      - config/mobile/**
      - docs/036-mobile-python-backend/**
      - runbooks/manage-mobile-backends.md
      - docs/031-expo-project-creation/**
      - runbooks/manage-expo-projects.md
      - config/templates/**
      - schemas/templates/**
      - docs/023-repository-credential-broker/**
      - config/repository-credentials/**
      - runbooks/manage-repository-credentials.md
      - docs/022-github-repository-automation/**
      - runbooks/manage-project-repositories.md
      - docs/025-multi-service-projects/**
      - runbooks/manage-multi-service-projects.md
      - config/browser-checks/**
      - docs/024-python-fastapi-template/**
      - runbooks/manage-python-apis.md
      - docs/021-template-catalogue/**
      - runbooks/manage-project-templates.md
      - config/toolchains/**
      - schemas/toolchains/**
      - docs/020-pinned-language-toolchains/**
      - runbooks/manage-project-toolchains.md
      - config/project-dependencies/**
      - schemas/project-dependencies/**
      - schemas/project/**
      - requirements/**
      - templates/apps/**
      - docs/019-project-dependency-policy/**
      - runbooks/manage-project-dependencies.md
      - docs/018-first-private-application/**
      - runbooks/manage-private-apps.md
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare isolated validator dependencies
        run: python3 scripts/setup-project-manifest.py --venv .venv-manifest
      - name: Offline lifecycle and ingress tests
        run: |
          .venv-manifest/bin/python scripts/tests/test_repository_credentials.py
          .venv-manifest/bin/python scripts/tests/test_project_repositories.py
          .venv-manifest/bin/python scripts/tests/test_project_mobile.py
          .venv-manifest/bin/python scripts/tests/test_project_templates.py
          .venv-manifest/bin/python scripts/tests/test_project_groups.py
          .venv-manifest/bin/python scripts/tests/test_private_apps.py
          .venv-manifest/bin/python scripts/tests/test_project_dependencies.py
          .venv-manifest/bin/python scripts/tests/test_project_toolchains.py
      - name: Check released template immutability
        env:
          TEMPLATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .venv-manifest/bin/python scripts/check-template-releases.py --baseline "$TEMPLATE_BASE_SHA"
      - name: Build pinned toolchain and generated app
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker build --file templates/apps/node-toolchain/Containerfile --tag gptclaw-toolchain-ci templates/apps/node-toolchain
          .venv-manifest/bin/python scripts/tests/check_app_template.py "$RUNNER_TEMP/gptclaw-app-template"
          app_ci_root="$RUNNER_TEMP/gptclaw-app-template/template-ci"
          for app_ci_step in install test typecheck build; do
            app_ci_args=(pnpm "$app_ci_step")
            if [[ "$app_ci_step" == install ]]; then
              app_ci_args+=(--frozen-lockfile --ignore-scripts --no-runtime --pm-on-fail=error --ignore-pnpmfile --registry=https://registry.npmjs.org/)
            fi
            docker run --rm --user "$(id -u):$(id -g)" \
              --memory=1536m --cpus=1 --pids-limit=256 \
              --cap-drop=all --security-opt=no-new-privileges \
              --volume "$app_ci_root:/workspace:rw" \
              --env GPTCLAW_PROJECT_ID=template-ci \
              --env pnpm_config_pm_on_fail=error \
              --env pnpm_config_ignore_scripts=true \
              --env pnpm_config_runtime=false \
              --env pnpm_config_ignore_pnpmfile=true \
              --env pnpm_config_verify_deps_before_run=false \
              gptclaw-toolchain-ci "${app_ci_args[@]}"
          done
      - name: Verify generated app dependency operations
        run: .venv-manifest/bin/python scripts/tests/check_dependency_template.py "$RUNNER_TEMP/gptclaw-dependency-template" --image gptclaw-toolchain-ci
      - name: Verify selected toolchain acquisition and lifecycle preparation
        run: .venv-manifest/bin/python scripts/tests/check_toolchain_template.py "$RUNNER_TEMP/gptclaw-toolchain-template"

  mobile-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare isolated validator dependencies
        run: python3 scripts/setup-project-manifest.py --venv .venv-manifest
      - name: Build exact mobile authoring toolchain
        run: docker build -t gptclaw-mobile-ci -f templates/apps/releases/expo-react-native/1.0.1/checks/toolchain/Containerfile templates/apps/releases/expo-react-native/1.0.1/checks/toolchain
      - name: Generate two native projects and verify both targets and defect rejection
        run: .venv-manifest/bin/python scripts/tests/check_mobile_template.py "$RUNNER_TEMP/gptclaw-mobile-source" --engine docker --image gptclaw-mobile-ci

  python-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare platform validator Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare isolated validator dependencies
        run: python3 scripts/setup-project-manifest.py --venv .venv-manifest
      - name: Offline Python policy and recovery tests
        run: .venv-manifest/bin/python scripts/tests/test_project_python.py
      - name: Verified Python image and generated quality/failure workflow
        run: .venv-manifest/bin/python scripts/tests/check_python_template.py "$RUNNER_TEMP/gptclaw-python-template"

  multi-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 scripts/setup-project-manifest.py --venv .venv-manifest
      - name: Generate and verify both services, contracts and browser journeys
        run: .venv-manifest/bin/python scripts/tests/check_group_template.py "$RUNNER_TEMP/gptclaw-group-template"

  development-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 scripts/setup-project-manifest.py --venv .venv-manifest
      - name: Persistent ownership and failure gates
        run: .venv-manifest/bin/python scripts/tests/test_project_database.py
      - name: Real PostgreSQL persistence, credentials and native recovery
        run: .venv-manifest/bin/python scripts/tests/check_database_template.py "$RUNNER_TEMP/gptclaw-database-template" --engine docker
      - name: Persistent starter frontend and browser workflow
        run: python3 "$RUNNER_TEMP/gptclaw-database-template/projects"/dbcheck-*/checks/verify.py --engine docker

  mobile-python-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 scripts/setup-project-manifest.py --venv .venv-manifest
      - name: Verify bound-native and Python API/database starters
        run: .venv-manifest/bin/python scripts/tests/check_mobile_backend_template.py "$RUNNER_TEMP/gptclaw-mobile-python" --engine docker
