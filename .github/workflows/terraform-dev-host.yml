name: Terraform development host

on:
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/workflows/terraform-dev-host.yml
      - infra/dev-host/**
      - scripts/check-repository.sh
  push:
    branches:
      - main
    paths:
      - .github/dependabot.yml
      - .github/workflows/terraform-dev-host.yml
      - infra/dev-host/**
      - scripts/check-repository.sh
  workflow_dispatch:
    inputs:
      operation:
        description: Remote Terraform operation
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      confirmation:
        description: Enter gptclaw-dev-host to authorize apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-gptclaw-dev-host
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLOUD_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.HCP_TERRAFORM_WORKSPACE }}
  TF_VAR_deployment_revision: ${{ github.sha }}
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION }}
  WORKING_DIRECTORY: infra/dev-host

jobs:
  quality:
    name: Format, validate, test, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check repository security invariants
        run: ./scripts/check-repository.sh

      - name: Check Terraform formatting
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform validate

      - name: Run Terraform tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform test

  plan:
    name: Protected remote plan
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require main for a manually dispatched plan
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A manually dispatched plan is allowed only from main." >&2
            exit 1
          fi

      - name: Require the protected HCP plan credential
        env:
          TF_API_TOKEN_PLAN: ${{ secrets.TF_API_TOKEN_PLAN }}
        run: |
          if [ -z "$TF_API_TOKEN_PLAN" ]; then
            echo "TF_API_TOKEN_PLAN is unavailable in the development environment." >&2
            exit 1
          fi

      - name: Install Terraform with HCP plan credentials
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN_PLAN }}

      - name: Initialize HCP Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -input=false -lockfile=readonly

      - name: Run remote speculative plan
        id: remote-plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee "$RUNNER_TEMP/terraform-plan.log"
          run_url=$(grep -Eo 'https://app\.terraform\.io/[^[:space:]]+/runs/run-[A-Za-z0-9]+' "$RUNNER_TEMP/terraform-plan.log" | tail -n 1 || true)
          {
            echo "## HCP Terraform speculative plan"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Actor: \`$GITHUB_ACTOR\`"
            echo "- Workspace: \`$TF_WORKSPACE\`"
            if [ -n "$run_url" ]; then
              echo "- HCP run: $run_url"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    name: Protected remote apply
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the apply authorization
        env:
          APPLY_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Apply is allowed only from main." >&2
            exit 1
          fi
          if [ "$APPLY_CONFIRMATION" != "gptclaw-dev-host" ]; then
            echo "Apply confirmation did not match gptclaw-dev-host." >&2
            exit 1
          fi
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$current_main_sha" ]; then
            echo "The requested revision is not current origin/main." >&2
            exit 1
          fi

      - name: Require the protected HCP credential
        env:
          TF_API_TOKEN_APPLY: ${{ secrets.TF_API_TOKEN_APPLY }}
        run: |
          if [ -z "$TF_API_TOKEN_APPLY" ]; then
            echo "TF_API_TOKEN_APPLY is unavailable in the development environment." >&2
            exit 1
          fi

      - name: Install Terraform with HCP apply credentials
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN_APPLY }}

      - name: Initialize HCP Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -input=false -lockfile=readonly

      - name: Run protected remote apply
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -o pipefail
          terraform apply -input=false -auto-approve -no-color 2>&1 | tee "$RUNNER_TEMP/terraform-apply.log"
          run_url=$(grep -Eo 'https://app\.terraform\.io/[^[:space:]]+/runs/run-[A-Za-z0-9]+' "$RUNNER_TEMP/terraform-apply.log" | tail -n 1 || true)
          {
            echo "## HCP Terraform apply"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Actor: \`$GITHUB_ACTOR\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Workspace: \`$TF_WORKSPACE\`"
            if [ -n "$run_url" ]; then
              echo "- HCP run: $run_url"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
