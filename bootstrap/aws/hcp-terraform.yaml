AWSTemplateFormatVersion: "2010-09-09"
Description: One-time HCP Terraform OIDC trust for the GptClaw development host

Parameters:
  HcpOrganization:
    Type: String
    Default: Bardsley
  HcpProject:
    Type: String
    Default: gptclaw
  HcpWorkspace:
    Type: String
    Default: gptclaw-dev-host

Resources:
  HcpTerraformOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://app.terraform.io
      ClientIdList:
        - aws.workload.identity
      Tags:
        - Key: Project
          Value: GptClaw
        - Key: ManagedBy
          Value: CloudFormation

  HcpTerraformPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gptclaw-dev-hcp-plan
      Description: Read-only AWS identity for gptclaw-dev-host HCP plans
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref HcpTerraformOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "app.terraform.io:aud": aws.workload.identity
                "app.terraform.io:sub": !Sub organization:${HcpOrganization}:project:${HcpProject}:workspace:${HcpWorkspace}:run_phase:plan
      Policies:
        - PolicyName: gptclaw-dev-host-plan
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEc2State
                Effect: Allow
                Action:
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeVolumeStatus
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcAttribute
                Resource: "*"
              - Sid: ReadCanonicalAmiParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id
              - Sid: ReadHostIamState
                Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gptclaw-dev-host
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/gptclaw-dev-host
              - Sid: ReadHostLogState
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                Resource: "*"
      Tags:
        - Key: Project
          Value: GptClaw
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation

  HcpTerraformApplyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gptclaw-dev-hcp-apply
      Description: Mutation identity for approved gptclaw-dev-host HCP applies
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref HcpTerraformOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "app.terraform.io:aud": aws.workload.identity
                "app.terraform.io:sub": !Sub organization:${HcpOrganization}:project:${HcpProject}:workspace:${HcpWorkspace}:run_phase:apply
      Policies:
        - PolicyName: gptclaw-dev-host-apply
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEc2State
                Effect: Allow
                Action:
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeVolumeStatus
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcAttribute
                Resource: "*"
              - Sid: ManageDevelopmentEc2
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:AttachVolume
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:CreateInternetGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVolume
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVolume
                  - ec2:DeleteVpc
                  - ec2:DetachInternetGateway
                  - ec2:DetachVolume
                  - ec2:DisassociateRouteTable
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVolume
                  - ec2:ModifyVpcAttribute
                  - ec2:ReplaceRoute
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RunInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ReadCanonicalAmiParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id
              - Sid: ManageHostRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gptclaw-dev-host
              - Sid: ManageHostInstanceProfile
                Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gptclaw-dev-host
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/gptclaw-dev-host
              - Sid: PassOnlyHostRoleToEc2
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gptclaw-dev-host
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: ManageHostLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: "*"
      Tags:
        - Key: Project
          Value: GptClaw
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation

  TailscaleEnrollmentSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: gptclaw/dev-host/tailscale-auth-key
      Description: One-use Tailscale enrollment key for the GptClaw development host
      Tags:
        - Key: Project
          Value: GptClaw
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  OidcProviderArn:
    Value: !Ref HcpTerraformOidcProvider
  PlanRoleArn:
    Value: !GetAtt HcpTerraformPlanRole.Arn
  ApplyRoleArn:
    Value: !GetAtt HcpTerraformApplyRole.Arn
  TailscaleSecretArn:
    Value: !Ref TailscaleEnrollmentSecret
