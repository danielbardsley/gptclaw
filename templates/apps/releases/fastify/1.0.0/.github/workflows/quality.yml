name: TypeScript API quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f Containerfile -t api-quality .
        # Build already verifies TypeScript and constructs the application.
      - run: docker run --rm --entrypoint pnpm api-quality verify
